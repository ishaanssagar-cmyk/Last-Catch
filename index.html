<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Last Catch</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #07131c; color: #e6f2f8; }
  main { max-width: 560px; margin: 40px auto; padding: 0 20px 40px; }
  h1 span { color: #2ec4b6; }
  h2 { font-size: 18px; margin: 28px 0 4px; }
  .card { background: #0f2230; border: 1px solid #1f3a4d; border-radius: 14px; padding: 20px; margin-top: 16px; }
  label { display: block; font-size: 14px; color: #8fb0c2; margin: 12px 0 4px; }
  input, select, textarea { width: 100%; box-sizing: border-box; background: #0a1a25; color: #e6f2f8;
    border: 1px solid #1f3a4d; border-radius: 8px; padding: 10px; font: inherit; }
  input[type=range] { padding: 0; border: 0; background: transparent; accent-color: #2ec4b6; }
  button { margin-top: 16px; background: #2ec4b6; color: #04211e; border: 0; border-radius: 10px;
    padding: 12px 18px; font-weight: 700; cursor: pointer; }
  button.ghost { background: transparent; color: #8fb0c2; border: 1px solid #1f3a4d; font-weight: 500; }
  button.small { margin-top: 0; padding: 6px 10px; font-size: 12px; }
  .score { font-size: 44px; font-weight: 800; }
  .count, .muted { font-size: 12px; color: #8fb0c2; }
  .count { text-align: right; }
  .catch { display: flex; gap: 14px; align-items: center; }
  .dot { width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0; }
  .grow { flex: 1; }
  .bar { height: 6px; background: #0a1a25; border-radius: 99px; overflow: hidden; margin-top: 6px; }
  .bar div { height: 100%; transition: width .4s; }
</style>
</head>
<body>
<main>
  <h1>Last<span>Catch</span> 🐟</h1>
  <p>Post your catch and get a live freshness score.</p>

  <div class="card">
    <label>Type of fish</label>
    <input id="type" list="fishList" value="Snoek" placeholder="Start typing, e.g. Snoek">
    <datalist id="fishList"></datalist>

    <label>Weight (kg)</label>
    <input id="weight" type="number" step="0.1" value="20">

    <label>Stored in ice?</label>
    <select id="iced"><option value="yes">Yes</option><option value="no">No</option></select>

    <label>Hours since caught</label>
    <input id="hours" type="number" step="0.5" min="0" value="2">

    <label>Description (max 100 characters)</label>
    <textarea id="desc" maxlength="100">gutted on the boat, kept in cooler, hot day, few bruised</textarea>
    <div class="count"><span id="chars">0</span>/100</div>

    <button id="go">Score my catch</button>
  </div>

  <div class="card" id="result" style="display:none"></div>

  <h2>My posted catches</h2>
  <div class="muted">Scores update live from the time each fish was caught. Saved on this device.</div>
  <div class="card">
    <label>⏩ Demo fast-forward: <b id="ffLabel">+0 h</b></label>
    <input id="ff" type="range" min="0" max="48" step="1" value="0">
    <div class="muted">Moves time forward to show catches losing freshness. Doesn't change saved data.</div>
  </div>
  <div id="myCatches"></div>
</main>

<script src="model1/model1.js"></script>
<script src="model2/model2_data.js"></script>
<script src="model2/model2.js"></script>
<script>
  const STORAGE_KEY = "lastcatch_catches";
  const UPDATE_EVERY_MS = 30 * 1000;      // refresh live scores every 30 seconds
  let fastForwardHours = 0;
  let pendingCatch = null;                // the scored catch, waiting to be posted

  // ---------- saving & loading (browser storage, this device only) ----------
  function loadCatches() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch (e) { return []; }
  }
  function saveCatches(list) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); } catch (e) { /* storage blocked: keep in memory */ }
  }
  let catches = loadCatches();

  // ---------- form helpers ----------
  document.getElementById("fishList").innerHTML = MODEL2_DATA.fish.map(f => `<option value="${f.name}">`).join("");
  const desc = document.getElementById("desc");
  const updateCount = () => document.getElementById("chars").textContent = desc.value.length;
  desc.oninput = updateCount; updateCount();
  const escapeHtml = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  // ---------- score a new catch (Model 1 -> Model 2) ----------
  document.getElementById("go").onclick = () => {
    const r = runModel1(document.getElementById("type").value, document.getElementById("weight").value,
                        document.getElementById("iced").value, desc.value);
    const box = document.getElementById("result");
    box.style.display = "block";
    if (!r.ok) { box.innerHTML = `<b style="color:#e74c3c">${r.error}</b>`; pendingCatch = null; return; }

    const r2 = runModel2(document.getElementById("hours").value);
    pendingCatch = {
      id: Date.now(), fishType: r.fishType, weightKg: r.weightKg, storedInIce: r.storedInIce,
      description: r.description, descriptionScore: r.descriptionScore, reasons: r.reasonsFound,
      group: r2.fishGroup, b: r2.b, m: r2.m, caughtAt: caughtAt,   // caughtAt is set by runModel2
    };
    renderResult();
  };

  function renderResult() {
    if (!pendingCatch) return;
    const c = pendingCatch, s = liveStatus(c, fastForwardHours);
    document.getElementById("result").innerHTML = `
      <div>Freshness right now</div>
      <div class="score" style="color:${s.stage.color}">${Math.round(s.score)} / 100</div>
      <p><b>${s.stage.name}</b> · ${s.hoursLeft > 0 ? `food-safe for about ${formatHours(s.hoursLeft)}` : "not food-safe: by-product use only"}</p>
      <p>${c.weightKg} kg of ${escapeHtml(c.fishType)} (${c.group.replace("_", " ")}) · ${c.storedInIce ? "on ice" : "no ice"} · caught ${formatHours(s.x)} ago</p>
      <p class="muted">Model 1, description score: <b>${c.descriptionScore}/10</b> (${escapeHtml(c.reasons.join(", ")) || "nothing specific mentioned"})<br>
      Model 2: b = ${c.b.toFixed(1)}, m = ${c.m.toFixed(4)} per hour, score(x) = b · e<sup>−m·x</sup></p>
      <button id="post">Post this catch</button>`;
    document.getElementById("post").onclick = postCatch;
  }

  // ---------- post: save with the time it was caught ----------
  function postCatch() {
    if (!pendingCatch) return;
    catches.unshift(pendingCatch);
    saveCatches(catches);
    pendingCatch = null;
    document.getElementById("result").style.display = "none";
    renderCatches();
  }

  window.removeCatch = id => {
    catches = catches.filter(c => c.id !== id);
    saveCatches(catches);
    renderCatches();
  };

  // ---------- live list: recalculated from caughtAt every time ----------
  function renderCatches() {
    const box = document.getElementById("myCatches");
    if (!catches.length) { box.innerHTML = `<div class="card muted">No catches posted yet.</div>`; return; }
    box.innerHTML = catches.map(c => {
      const s = liveStatus(c, fastForwardHours);
      return `<div class="card catch">
        <div class="dot" style="background:${s.stage.color}"></div>
        <div class="grow">
          <b>${escapeHtml(c.fishType)}</b> · ${c.weightKg} kg · ${c.storedInIce ? "on ice" : "no ice"}<br>
          <span style="color:${s.stage.color}"><b>${Math.round(s.score)}/100 · ${s.stage.name}</b></span>
          <span class="muted"> · caught ${formatHours(s.x)} ago · ${s.hoursLeft > 0 ? `${formatHours(s.hoursLeft)} left as food` : "by-product only"}</span>
          <div class="bar"><div style="width:${Math.max(0, Math.min(100, s.score))}%;background:${s.stage.color}"></div></div>
        </div>
        <button class="ghost small" onclick="removeCatch(${c.id})">Remove</button>
      </div>`;
    }).join("");
  }

  // ---------- demo fast-forward ----------
  document.getElementById("ff").oninput = e => {
    fastForwardHours = +e.target.value;
    document.getElementById("ffLabel").textContent = "+" + fastForwardHours + " h";
    renderCatches(); renderResult();
  };

  // ---------- keep everything live ----------
  renderCatches();
  setInterval(() => { renderCatches(); renderResult(); }, UPDATE_EVERY_MS);
</script>
</body>
</html>
